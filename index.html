<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Central Division Standings</title>

<style>
body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    font-size: 48px;
    margin: 20px;
}

.container {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.division {
    flex: 1;
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
}

.division h2 {
    text-align: center;
    margin-top: 0;
    font-size: 32px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #334155;
    padding: 12px;
    font-size: 22px;
}

td {
    padding: 12px;
    font-size: 20px;
    border-bottom: 1px solid #475569;
    text-align: center;
}

.updated {
    text-align: center;
    font-size: 18px;
    color: #cbd5e1;
    margin: 20px;
}
</style>
</head>

<body>

<h1>MLB CENTRAL DIVISION STANDINGS</h1>

<div class="container">

<!-- AL CENTRAL -->
<div class="division">
<h2>American League Central</h2>
<table>
<tr><th>Team</th><th>W</th><th>L</th></tr>

<tr><td>Guardians</td><td id="cle-w">0</td><td id="cle-l">0</td></tr>
<tr><td>White Sox</td><td id="cws-w">0</td><td id="cws-l">0</td></tr>
<tr><td>Twins</td><td id="min-w">0</td><td id="min-l">0</td></tr>
<tr><td>Royals</td><td id="kc-w">0</td><td id="kc-l">0</td></tr>
<tr><td>Tigers</td><td id="det-w">0</td><td id="det-l">0</td></tr>

</table>
</div>

<!-- NL CENTRAL -->
<div class="division">
<h2>National League Central</h2>
<table>
<tr><th>Team</th><th>W</th><th>L</th></tr>

<tr><td>Brewers</td><td id="mil-w">0</td><td id="mil-l">0</td></tr>
<tr><td>Cubs</td><td id="chc-w">0</td><td id="chc-l">0</td></tr>
<tr><td>Cardinals</td><td id="stl-w">0</td><td id="stl-l">0</td></tr>
<tr><td>Reds</td><td id="cin-w">0</td><td id="cin-l">0</td></tr>
<tr><td>Pirates</td><td id="pit-w">0</td><td id="pit-l">0</td></tr>

</table>
</div>

</div>

<div class="updated" id="lastUpdated">
Loading updates...
</div>

<script>
async function loadStandings() {
  try {
    const url =
      "https://corsproxy.io/?" +
      encodeURIComponent("https://statsapi.mlb.com/api/v1/standings");

    const res = await fetch(url);
    const data = await res.json();

    console.log("===== FULL API RESPONSE =====");
    console.log(data);

    if (!data.records) {
      console.log("NO RECORDS FOUND");
      return;
    }

    data.records.forEach((div, i) => {
      console.log(`\n===== DIVISION ${i} =====`);

      div.teamRecords.forEach(team => {
        console.log("TEAM OBJECT:", team);

        console.log("NAME OPTIONS:",
          team.team?.name,
          team.team?.displayName,
          team.team?.teamName
        );

        console.log("WINS OPTIONS:",
          team.wins,
          team.leagueRecord?.wins,
          team.records?.leagueRecord?.wins
        );

        console.log("LOSSES OPTIONS:",
          team.losses,
          team.leagueRecord?.losses,
          team.records?.leagueRecord?.losses
        );
      });
    });

    document.getElementById("lastUpdated").innerText =
      "Check console for API structure";

  } catch (err) {
    console.error("ERROR:", err);
  }
}

window.onload = loadStandings;
</script>
</body>
</html>
