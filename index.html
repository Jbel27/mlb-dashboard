<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Central Division Standings</title>

<style>
body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    font-size: 48px;
    margin: 20px;
}

.container {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.division {
    flex: 1;
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
}

.division h2 {
    text-align: center;
    margin-top: 0;
    font-size: 32px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #334155;
    padding: 12px;
    font-size: 22px;
}

td {
    padding: 12px;
    font-size: 20px;
    border-bottom: 1px solid #475569;
    text-align: center;
}

.updated {
    text-align: center;
    font-size: 18px;
    color: #cbd5e1;
    margin: 20px;
}
</style>
</head>

<body>

<h1>MLB CENTRAL DIVISION STANDINGS</h1>

<div class="container">

<!-- AL CENTRAL -->
<div class="division">
<h2>American League Central</h2>
<table>
<tr><th>Team</th><th>W</th><th>L</th></tr>

<tr><td>Guardians</td><td id="cle-w">0</td><td id="cle-l">0</td></tr>
<tr><td>White Sox</td><td id="cws-w">0</td><td id="cws-l">0</td></tr>
<tr><td>Twins</td><td id="min-w">0</td><td id="min-l">0</td></tr>
<tr><td>Royals</td><td id="kc-w">0</td><td id="kc-l">0</td></tr>
<tr><td>Tigers</td><td id="det-w">0</td><td id="det-l">0</td></tr>

</table>
</div>

<!-- NL CENTRAL -->
<div class="division">
<h2>National League Central</h2>
<table>
<tr><th>Team</th><th>W</th><th>L</th></tr>

<tr><td>Brewers</td><td id="mil-w">0</td><td id="mil-l">0</td></tr>
<tr><td>Cubs</td><td id="chc-w">0</td><td id="chc-l">0</td></tr>
<tr><td>Cardinals</td><td id="stl-w">0</td><td id="stl-l">0</td></tr>
<tr><td>Reds</td><td id="cin-w">0</td><td id="cin-l">0</td></tr>
<tr><td>Pirates</td><td id="pit-w">0</td><td id="pit-l">0</td></tr>

</table>
</div>

</div>

<div class="updated" id="lastUpdated">
Loading updates...
</div>

<script>
// Stable MLB Team IDs (this is the IMPORTANT FIX)
const teamMap = {
  114: "cle", // Guardians
  145: "cws", // White Sox
  142: "min", // Twins
  118: "kc",  // Royals
  116: "det", // Tigers

  158: "mil", // Brewers
  112: "chc", // Cubs
  138: "stl", // Cardinals
  113: "cin", // Reds
  134: "pit"  // Pirates
};

async function loadStandings() {
  try {
    const url =
      "https://corsproxy.io/?" +
      encodeURIComponent("https://statsapi.mlb.com/api/v1/standings");

    const res = await fetch(url);
    const data = await res.json();

    if (!data.records) {
      throw new Error("No records in API response");
    }

    data.records.forEach(div => {
      div.teamRecords.forEach(team => {

        const teamId =
  team.team?.id ||
  team.team?.team?.id ||
  team.team?.franchiseId ||
  null;
          if (!teamId) {
  console.log("NO TEAM ID FOUND:", team);
        const prefix = teamMap[teamId];

        if (!prefix) return;

        const w = team.wins;
        const l = team.losses;

        const wEl = document.getElementById(`${prefix}-w`);
        const lEl = document.getElementById(`${prefix}-l`);

        if (wEl && lEl) {
          wEl.innerText = w;
          lEl.innerText = l;
        }
      });
    });

    document.getElementById("lastUpdated").innerText =
      "Last updated: " + new Date().toLocaleTimeString();

  } catch (err) {
    console.error("ERROR LOADING STANDINGS:", err);
    document.getElementById("lastUpdated").innerText =
      "Error loading data (check console)";
  }
}

window.onload = loadStandings;
setInterval(loadStandings, 10 * 60 * 1000);
</script>

</body>
</html>
