<!DOCTYPE html>
<html>
<head>
  <title>MLB Central Standings</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      font-family: Arial;
      color: white;
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 44px;
    }

    .grid {
      display: flex;
      height: 90vh;
      gap: 10px;
      padding: 10px;
    }

    iframe {
      flex: 1;
      border: none;
      border-radius: 10px;
      background: white;
    }
  </style>
</head>

<body>

  <h1>MLB CENTRAL DIVISIONS</h1>

  <div class="grid">

    <!-- AL Central -->
    <iframe
      src="https://www.espn.com/mlb/standings/_/group/2"
      loading="lazy">
    </iframe>

    <!-- NL Central -->
    <iframe
      src="https://www.espn.com/mlb/standings/_/group/1"
      loading="lazy">
    </iframe>

  </div>

</body>
</html>
